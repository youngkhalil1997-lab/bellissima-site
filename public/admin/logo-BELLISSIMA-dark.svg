<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="blueGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#0099E6"/>
    </linearGradient>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#E6C84C"/>
    </linearGradient>
    <linearGradient id="circuitGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#E6C84C"/>
      <stop offset="100%" stop-color="#B8942E"/>
    </linearGradient>
    <filter id="glowBDark">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Groupe B stylisé -->
  <g transform="translate(120, 100)">

    <!-- B principal -->
    <text x="0" y="0" font-family="'Times New Roman', Georgia, serif" font-size="110" font-weight="bold"
          fill="url(#blueGradDark)" text-anchor="middle" dominant-baseline="central" filter="url(#glowBDark)">B</text>

    <!-- Pistes de circuit imprimé dorées traversant le B -->
    <line x1="-65" y1="-55" x2="-20" y2="-55" stroke="url(#circuitGoldDark)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-20" cy="-55" r="3" fill="#D4AF37"/>
    <line x1="-20" y1="-55" x2="-20" y2="-40" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-20" cy="-40" r="2.5" fill="#D4AF37"/>
    <line x1="-20" y1="-40" x2="15" y2="-40" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>

    <line x1="-55" y1="-30" x2="-55" y2="30" stroke="url(#circuitGoldDark)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-55" cy="-30" r="3" fill="#D4AF37"/>
    <circle cx="-55" cy="30" r="3" fill="#D4AF37"/>
    <line x1="-55" y1="30" x2="-55" y2="50" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>

    <line x1="-40" y1="0" x2="40" y2="0" stroke="url(#circuitGoldDark)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-40" cy="0" r="3" fill="#D4AF37"/>
    <circle cx="40" cy="0" r="3" fill="#D4AF37"/>

    <line x1="25" y1="-55" x2="55" y2="-25" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
    <circle cx="25" cy="-55" r="2.5" fill="#D4AF37"/>
    <circle cx="55" cy="-25" r="2.5" fill="#D4AF37"/>
    <line x1="55" y1="-25" x2="55" y2="-5" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>

    <line x1="-30" y1="40" x2="25" y2="40" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
    <circle cx="25" cy="40" r="2.5" fill="#D4AF37"/>
    <line x1="25" y1="40" x2="40" y2="25" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>

    <circle cx="-10" cy="-20" r="2" fill="#D4AF37" opacity="0.7"/>
    <circle cx="20" cy="20" r="2" fill="#D4AF37" opacity="0.7"/>
    <circle cx="-35" cy="15" r="2" fill="#D4AF37" opacity="0.7"/>

    <!-- Goutte d'eau -->
    <g transform="translate(0, 0)">
      <path d="M0,-22 C12,-12 16,0 16,8 C16,16 9,22 0,22 C-9,22 -16,16 -16,8 C-16,0 -12,-12 0,-22Z"
            fill="url(#goldGradDark)" opacity="0.95"/>
      <path d="M-5,-12 C-3,-8 -2,-2 -3,2"
            fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>

  <!-- BELLISSIMA texte foncé pour fond clair -->
  <text x="200" y="97" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-weight="bold"
        fill="#1a1a2e" letter-spacing="7">BELLISSIMA</text>

  <!-- Sous-titre -->
  <text x="200" y="138" font-family="'Georgia', 'Times New Roman', serif" font-size="22" fill="#D4AF37"
        letter-spacing="5" font-weight="bold">SMART LAUNDRY</text>
</svg>
